plugins {
    id 'fabric-loom' version '1.2.10'
    id 'java'
}

group = 'com.example'
version = '1.0.0'
archivesBaseName = 'silentcore'

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${minecraft_version}+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.14.23"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.86.0+1.20.1"
    // Auto Config (for Mod Menu / Cloth Config integration)
    modImplementation "me.shedaniel.autoconfig:autoconfig-core:4.2.0"
    modImplementation "me.shedaniel.autoconfig:autoconfig-gson:4.2.0"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:6.0.46"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

loom {
    // default Loom configuration; adjust versions above if needed
}
