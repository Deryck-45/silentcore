name: Build SilentCore

on:
  push:
    branches: [ main, add-silentcore-files ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          arguments: build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: silentcore-jar
          path: build/libs/*.jar
